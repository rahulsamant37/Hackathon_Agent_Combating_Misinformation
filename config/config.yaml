llm:
  providers:
    gemini:
      model: "gemini-2.0-flash"
      max_tokens: 4096
      temperature: 0.1
      timeout: 30
      retry_attempts: 3
      retry_delay: 1
    groq:
      model: "mixtral-8x7b-32768"
      max_tokens: 4096
      temperature: 0.1
      timeout: 30
      retry_attempts: 3
      retry_delay: 1
  
  default_provider: "gemini"
  fallback_provider: "groq"

analysis:
  text:
    max_length: 2000
    timeout: 10
    chunk_size: 1000
    overlap: 100
  image:
    max_size: 5242880  # 5MB
    supported_formats: ["jpg", "jpeg", "png", "gif", "webp"]
    timeout: 15
    max_dimensions: [4096, 4096]
  url:
    timeout: 10
    max_redirects: 5
    user_agent: "MisinformationDetectionTool/1.0"
    max_content_size: 10485760  # 10MB

risk_assessment:
  thresholds:
    low: 0.3
    medium: 0.6
    high: 0.8
  confidence_threshold: 0.5
  
  indicators:
    emotional_language:
      weight: 0.2
      severity_multiplier: 1.5
    logical_fallacies:
      weight: 0.3
      severity_multiplier: 2.0
    source_credibility:
      weight: 0.25
      severity_multiplier: 1.8
    factual_inconsistency:
      weight: 0.25
      severity_multiplier: 2.2

education:
  modules_path: "static/education"
  progress_tracking: true
  recommendations_enabled: true
  max_suggestions: 5
  
  modules:
    - id: "basic_misinformation"
      title: "Understanding Misinformation"
      description: "Learn the basics of identifying misinformation"
      difficulty: "beginner"
    - id: "source_evaluation"
      title: "Evaluating Sources"
      description: "How to assess the credibility of information sources"
      difficulty: "intermediate"
    - id: "logical_fallacies"
      title: "Common Logical Fallacies"
      description: "Recognize and understand logical fallacies in arguments"
      difficulty: "intermediate"

api:
  rate_limiting:
    requests_per_minute: 60
    burst_limit: 10
  
  cors:
    allow_origins: ["*"]
    allow_methods: ["GET", "POST", "PUT", "DELETE"]
    allow_headers: ["*"]
  
  pagination:
    default_page_size: 20
    max_page_size: 100

cache:
  enabled: true
  ttl: 3600  # 1 hour
  max_size: 1000
  
  redis:
    enabled: false
    url: "redis://localhost:6379/0"
    key_prefix: "misinformation_tool:"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_rotation: "daily"
  max_file_size: "10MB"
  backup_count: 7
  
  loggers:
    api: "INFO"
    llm: "INFO"
    analysis: "INFO"
    streamlit: "INFO"

security:
  max_request_size: 10485760  # 10MB
  allowed_file_types: ["txt", "jpg", "jpeg", "png", "gif", "webp", "pdf"]
  scan_uploads: true
  
  content_filtering:
    enabled: true
    max_text_length: 50000
    blocked_patterns: []

monitoring:
  metrics_enabled: true
  health_check_interval: 30
  performance_tracking: true
  
  alerts:
    error_threshold: 10
    response_time_threshold: 5000  # 5 seconds
    memory_threshold: 80  # 80% memory usage